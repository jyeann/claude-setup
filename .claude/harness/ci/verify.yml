# Copy to .github/workflows/verify.yml in a project built with the harness.
# Required status checks for the ruleset: verify, protected-files, secret-scan (pinned to the Actions app)
#   .claude/harness/ci/protect.sh --checks verify,protected-files,secret-scan --apply
# Fast checks (protected-files, secret-scan) run on every event. The heavy `verify` job runs only on a PR that is
# not a draft, and on workflow_dispatch; a docs-only PR skips its steps (docs/, *.md, never a protected path).
# A push to main runs only the fast checks: the ruleset's strict up-to-date rule means the merged tree passed.
# Open PRs as drafts and mark them ready when the work is done. Why: claude-setup ADR-0004 (#105).
name: verify

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Docs-only change? (the steps below skip only when every changed file is documentation)
        id: scope
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node .claude/harness/bin/docs-only.js --base "origin/$BASE_REF"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        with:
          node-version: 22
      - name: Install dependencies (no install scripts)
        if: ${{ steps.scope.outputs.docs_only != 'true' && hashFiles('package-lock.json') != '' }}
        run: npm ci --ignore-scripts
      - name: Strong verify (tests, source coverage, test quality, mutation spot-check)
        if: ${{ steps.scope.outputs.docs_only != 'true' }}
        run: node .claude/harness/bin/verify.js

  # Fails a PR that edits the gate (acceptance tests, verify config, .claude/, workflows). The checker and its
  # protected-path list come from the BASE branch, so the PR cannot edit its own judge. There is no label override:
  # a human admin merges deliberate gate changes with the ruleset bypass. Bootstrap: the first PR that adds the
  # harness has no base copy of the checker; merge that one as an admin.
  protected-files:
    name: protected-files
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: No protected files changed
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git worktree add ../base-tree "origin/$BASE_REF"
          node ../base-tree/.claude/harness/bin/check-protected.js --base "origin/$BASE_REF"

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Scan tracked files for secrets
        run: node .claude/harness/bin/scan-secrets.js
      - name: Scan this PR's history (a secret added then removed is still leaked)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node .claude/harness/bin/scan-secrets.js --history "origin/$BASE_REF"
