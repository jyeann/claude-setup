<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Export - Retro board</title>
<link rel="stylesheet" href="/assets/app.css">
<script type="module" src="/assets/js/export.js"></script>
</head>
<body class="page-export">
<a id="skip-link" class="skip-link" href="#main">Skip to main content</a>
<header class="site-header"><a id="back-to-board" data-testid="back-to-board" class="btn" href="/">Back to board</a></header>
<main id="main">
<h1 id="export-title" tabindex="-1">Export markdown</h1>
<p id="export-hint">Preview of what will be copied or downloaded.</p>
<p id="loading" data-testid="loading" role="status">Preparing the export...</p>
<p id="export-error" class="banner banner-danger" role="alert" hidden>Could not prepare the export. Go back to the board and try again.</p>
<div id="export-actions" class="toolbar" hidden>
<button id="copy-markdown" data-testid="copy-markdown" class="btn btn-primary" type="button">Copy to clipboard</button>
<a id="download-markdown" data-testid="download-markdown" class="btn" download="retro.md">Download .md</a>
</div>
<p id="copy-status" class="hint" hidden></p>
<pre id="export-preview" data-testid="export-preview" tabindex="0" aria-label="Markdown preview" hidden></pre>
</main>
<div id="live-polite" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="live-assertive" class="sr-only" role="alert"></div>
</body>
</html>
