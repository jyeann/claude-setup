<svg xmlns="http://www.w3.org/2000/svg" class="sprite" aria-hidden="true" focusable="false" width="0" height="0">
  <defs>
    <pattern id="hatch-crit" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line hatch-line-crit" x1="0" y1="0" x2="0" y2="4"/></pattern>
    <pattern id="hatch-zone" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line class="hatch-line hatch-line-zone" x1="0" y1="0" x2="0" y2="4"/></pattern>
    <radialGradient id="glow-warn" cx="50%" cy="50%" r="50%"><stop class="glow-stop-warn" offset="0%" stop-opacity="1"/><stop class="glow-stop-warn" offset="100%" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-crit" cx="50%" cy="50%" r="50%"><stop class="glow-stop-crit" offset="0%" stop-opacity="1"/><stop class="glow-stop-crit" offset="100%" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow-recv" cx="50%" cy="50%" r="50%"><stop class="glow-stop-recv" offset="0%" stop-opacity="1"/><stop class="glow-stop-recv" offset="100%" stop-opacity="0"/></radialGradient>
  </defs>

  <!-- Status shapes, 12x12. Colour comes from the parent (currentColor); the shape and the text label always travel with it. -->
  <symbol id="ic-ok" viewBox="0 0 12 12"><circle cx="6" cy="6" r="5" fill="currentColor"/></symbol>
  <symbol id="ic-warn" viewBox="0 0 12 12"><path d="M6 0.8 L11.4 10.6 H0.6 Z" fill="currentColor"/></symbol>
  <symbol id="ic-crit" viewBox="0 0 12 12"><path fill="currentColor" fill-rule="evenodd" d="M6 0.2 L11.8 6 L6 11.8 L0.2 6 Z M5.2 2.7 H6.8 V6.3 H5.2 Z M5.2 7.3 H6.8 V8.9 H5.2 Z"/></symbol>
  <symbol id="ic-recv" viewBox="0 0 12 12"><circle cx="6" cy="6" r="4.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M6 1.4 A4.6 4.6 0 0 0 6 10.6 Z" fill="currentColor"/></symbol>
  <symbol id="ic-note" viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>

  <!-- Replay marks, 24x24. D hollow circle, F filled circle, x diamond, dot small square. The letter is real text drawn over the shape. -->
  <symbol id="ic-mark-d" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/></symbol>
  <symbol id="ic-mark-f" viewBox="0 0 24 24"><circle cx="12" cy="12" r="11" fill="currentColor"/></symbol>
  <symbol id="ic-mark-x" viewBox="0 0 24 24"><path d="M12 0.8 L23.2 12 L12 23.2 L0.8 12 Z" fill="currentColor"/></symbol>
  <symbol id="ic-mark-dot" viewBox="0 0 24 24"><rect x="8" y="8" width="8" height="8" fill="none" stroke="currentColor" stroke-width="2"/></symbol>

  <!-- Node glyphs, 20x20, 1.5 stroke, square caps. -->
      <symbol id="ic-clients" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><rect x="2.75" y="4.25" width="14.5" height="11.5"/><path d="M2.75 8.25 H17.25"/><path d="M5.5 6.25 H5.6 M8 6.25 H8.1 M10.5 6.25 H10.6"/></symbol>
    <symbol id="ic-lb" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M10 2.75 V8 M10 8 L4 12 V17.25 M10 8 V17.25 M10 8 L16 12 V17.25"/></symbol>
    <symbol id="ic-service" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M10 2.5 L16.5 6.25 V13.75 L10 17.5 L3.5 13.75 V6.25 Z"/></symbol>
    <symbol id="ic-cache" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M3.5 4.25 H16.5 V7.25 H3.5 Z M3.5 8.75 H16.5 V11.75 H3.5 Z M3.5 13.25 H16.5 V16.25 H3.5 Z"/></symbol>
    <symbol id="ic-db" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><ellipse cx="10" cy="5" rx="6.5" ry="2.5"/><path d="M3.5 5 V15 C3.5 16.4 6.4 17.5 10 17.5 C13.6 17.5 16.5 16.4 16.5 15 V5"/><path d="M3.5 10 C3.5 11.4 6.4 12.5 10 12.5 C13.6 12.5 16.5 11.4 16.5 10"/></symbol>
    <symbol id="ic-replica" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><ellipse cx="9" cy="4.75" rx="5.75" ry="2.25"/><path d="M3.25 4.75 V13.25 C3.25 14.5 5.8 15.5 9 15.5 C12.2 15.5 14.75 14.5 14.75 13.25 V4.75"/><path d="M3.25 9 C3.25 10.2 5.8 11.25 9 11.25 C12.2 11.25 14.75 10.2 14.75 9"/><path d="M12.5 16 L14.5 18 L18 13.75"/></symbol>
    <symbol id="ic-queue" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M3 5 V15 M6.5 5 V15 M10 5 V15"/><path d="M12.75 10 H18 M15.25 7.25 L18 10 L15.25 12.75"/></symbol>
    <symbol id="ic-consumer" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M10.25 4.25 H3.25 V16.75 H15.75 V9.75"/><path d="M8.5 11.5 L17 3 M12.25 3 H17 V7.75"/></symbol>
    <symbol id="ic-partner" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M5 3.5 H2.75 V16.5 H5 M12.5 3.5 H14.75 V7 M12.5 16.5 H14.75 V14"/><rect x="5.75" y="7.75" width="5.5" height="5.5"/><path d="M12.5 10.5 H18 M15.75 8.25 L18 10.5 L15.75 12.75"/></symbol>

    <!-- Control icons -->
    <symbol id="ic-pause" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M6.5 4.5 V15.5 M13.5 4.5 V15.5"/></symbol>
    <symbol id="ic-play" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M6 3.75 L16 10 L6 16.25 Z"/></symbol>
    <symbol id="ic-step" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M4.5 4 L13 10 L4.5 16 Z M16 4.5 V15.5"/></symbol>
    <symbol id="ic-external" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M8.5 4.25 H3.75 V16.25 H15.75 V11.5 M11.5 3.5 H16.5 V8.5 M16.25 3.75 L9 11"/></symbol>
    <symbol id="ic-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M4 10.5 L8.25 14.5 L16 5.5"/></symbol>
    <symbol id="ic-close" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M4.5 4.5 L15.5 15.5 M15.5 4.5 L4.5 15.5"/></symbol>
    <symbol id="ic-chevron" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" stroke-linejoin="miter"><path d="M7 4.5 L13 10 L7 15.5"/></symbol>
</svg>
