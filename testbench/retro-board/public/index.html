<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Retro board</title>
<link rel="stylesheet" href="/assets/app.css">
<script type="module" src="/assets/js/home.js"></script>
</head>
<body class="page-home">
<a id="skip-link" class="skip-link" href="#main">Skip to main content</a>
<header class="site-header"><span class="brand">Retro board</span></header>
<main id="main" class="narrow">
<h1 id="home-title" tabindex="-1">Retro board</h1>
<p id="home-intro">Run a retro in three columns. No sign-up, no names.</p>
<form id="create-form" class="card-form" novalidate>
<h2>Create a retro</h2>
<label for="title-input">Title</label>
<input id="title-input" data-testid="title-input" name="title" type="text" maxlength="100" autocomplete="off" aria-describedby="title-hint title-error">
<p id="title-hint" class="hint">For example, Sprint 12.</p>
<p id="title-error" class="field-error" data-testid="title-error" hidden></p>
<p id="create-error" class="banner banner-danger" role="alert" hidden></p>
<button id="create-submit" data-testid="create-submit" class="btn btn-primary" type="submit">Create retro</button>
</form>
</main>
<div id="live-polite" class="sr-only" aria-live="polite" aria-atomic="true"></div>
<div id="live-assertive" class="sr-only" role="alert"></div>
</body>
</html>
